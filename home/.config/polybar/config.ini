include-file = ~/.config/polybar/colors.ini

; Barra flutuante: alinhada com o window_gap (12) do bspwm
[bar/main]
width = 100%:-24
height = 28
offset-x = 12
offset-y = 8
radius = 10

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
border-color = ${colors.line}

padding-left = 2
padding-right = 2
module-margin = 1

separator = ·
separator-foreground = ${colors.line}

; font-0: texto | font-1: icones (use %{T2}...%{T-})
; Precisa de uma Nerd Font de simbolos (ex.: "Symbols Nerd Font")
font-0 = "JetBrainsMono:size=9;3"
font-1 = "Symbols Nerd Font:size=11;3"

modules-left = bspwm title
modules-center = date
modules-right = tray pulseaudio cpu memory battery

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

[module/bspwm]
type = internal/bspwm

format = <label-state>

label-focused = ●
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

label-occupied = ●
label-occupied-foreground = ${colors.muted}
label-occupied-padding = 1

label-empty = ○
label-empty-foreground = ${colors.line}
label-empty-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

[module/title]
type = internal/xwindow

label = %title%
label-maxlen = 50
label-foreground = ${colors.muted}

[module/tray]
type = internal/tray

tray-size = 14
tray-spacing = 6
tray-padding = 2
tray-background = ${colors.background}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

format-muted = <label-muted>
label-muted = %{T2}󰖁%{T-} mudo
label-muted-foreground = ${colors.alert}

ramp-volume-0 = %{T2}󰕿%{T-}
ramp-volume-1 = %{T2}󰖀%{T-}
ramp-volume-2 = %{T2}󰕾%{T-}
ramp-volume-foreground = ${colors.primary}

click-right = pavucontrol

[module/cpu]
type = internal/cpu

interval = 2
warn-percentage = 85

format = <label>
format-prefix = "%{T2}󰘚%{T-} "
format-prefix-foreground = ${colors.secondary}
label = %percentage:2%%

format-warn = <label-warn>
format-warn-prefix = "%{T2}󰘚%{T-} "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage:2%%
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory

interval = 2
warn-percentage = 85

format = <label>
format-prefix = "%{T2}󰍛%{T-} "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

format-warn = <label-warn>
format-warn-prefix = "%{T2}󰍛%{T-} "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage_used%%
label-warn-foreground = ${colors.alert}

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC0

full-at = 98
low-at = 20
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "%{T2}󰂄%{T-} "
format-charging-prefix-foreground = ${colors.secondary}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "%{T2}󰁹%{T-} "
format-full-prefix-foreground = ${colors.secondary}
label-full = %percentage%%

format-low = <label-low>
format-low-prefix = "%{T2}󰂃%{T-} "
format-low-prefix-foreground = ${colors.alert}
label-low = %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = %{T2}󰁺%{T-}
ramp-capacity-1 = %{T2}󰁼%{T-}
ramp-capacity-2 = %{T2}󰁾%{T-}
ramp-capacity-3 = %{T2}󰂀%{T-}
ramp-capacity-4 = %{T2}󰁹%{T-}
ramp-capacity-foreground = ${colors.foreground}

; Clique no relogio alterna para data completa + segundos
[module/date]
type = internal/date

interval = 1

date = %a %d/%m
date-alt = %A, %d de %B de %Y
time = %H:%M
time-alt = %H:%M:%S

format = <label>
label = %{T2}󰃭%{T-} %date%  %{T2}󰅐%{T-} %time%
label-foreground = ${colors.primary}
