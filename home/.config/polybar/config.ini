[colors]
background = #2e3440
foreground = #d8dee9
primary = #88c0d0
secondary = #a3be8c
alert = #bf616a
muted = #4c566a

[bar/main]
width = 100%
height = 28
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = JetBrainsMono:size=10;2
font-1 = Symbols Nerd Font:size=10;2

modules-left = bspwm
modules-center = title
modules-right = cpu memory battery pulseaudio date

enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize


[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.background}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1


[module/title]
type = internal/xwindow

label = %title%
label-maxlen = 60

label-foreground = ${colors.foreground}


[module/cpu]
type = internal/cpu

interval = 2

format = <label>
label =   %percentage:2%%

label-foreground = ${colors.secondary}


[module/memory]
type = internal/memory

interval = 2

format = <label>
label =   %percentage_used:2%%

label-foreground = ${colors.primary}


[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

full-at = 99

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

format-charging-foreground = ${colors.secondary}
format-discharging-foreground = ${colors.foreground}
format-full-foreground = ${colors.secondary}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 

animation-charging-framerate = 750


[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>

label-volume = %percentage%%

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

format-muted =  <label-muted>
label-muted = muted

format-volume-foreground = ${colors.foreground}
format-muted-foreground = ${colors.alert}

[module/date]
type = internal/date

interval = 1

date = %d/%m/%Y
time = %H:%M:%S

format = <label>
label =   %date% %time%

label-foreground = ${colors.primary}
