# Configuração do Alacritty - Gruvbox Purple

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono"

[window]
opacity = 0.92
padding = { x = 14, y = 12 }
dynamic_padding = true

[colors.primary]
background = "#1D2021"
foreground = "#EBDBB2"
dim_foreground = "#928374"
bright_foreground = "#FBF1C7"

[colors.cursor]
text = "#1D2021"
cursor = "#D3869B"

[colors.vi_mode_cursor]
text = "#1D2021"
cursor = "#B16286"

[colors.selection]
text = "#1D2021"
background = "#D3869B"

[colors.normal]
black = "#3C3836"
red = "#FB4934"
green = "#B8BB26"
yellow = "#FABD2F"
blue = "#83A598"
magenta = "#D3869B"
cyan = "#8EC07C"
white = "#EBDBB2"

[colors.bright]
