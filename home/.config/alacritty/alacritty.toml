# Configuração do Alacritty - Viozene

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono"

[window]
opacity = 0.92
padding = { x = 14, y = 12 }
dynamic_padding = true

[colors.primary]
background = "#15121C"
foreground = "#CAC3D2"

[colors.cursor]
text = "#15121C"
cursor = "#E5C07B"

[colors.selection]
text = "#15121C"
background = "#A6DA95"

[colors.normal]
black = "#514D59"
red = "#E06C75"
green = "#A6DA95"
yellow = "#E5C07B"
blue = "#7AA2F7"
magenta = "#9B7EDE"
cyan = "#7DCFFF"
white = "#CAC3D2"

[colors.bright]
black = "#6F6A77"
red = "#E2838E"
green = "#B3DBA7"
yellow = "#ECCB8F"
blue = "#90AEF6"
magenta = "#AA92E2"
cyan = "#92D2FC"
white = "#E8E0F0"

[colors.dim]
black = "#332F3A"
red = "#B75A63"
green = "#89B27D"
yellow = "#B79A62"
blue = "#6685CB"
magenta = "#8068B7"
cyan = "#68A9D2"
white = "#ACA5B3"
