# appearance/settings.conf - theme-independent appearance settings.
#
# Everything related to the look of the desktop lives in this module:
#   settings.conf   -> cursor, fonts, wallpapers, bspwm look
#   dark.conf       -> Solarized Dark palette and per-theme colors
#   light.conf      -> Solarized Light palette and per-theme colors
#   apply.sh        -> renders the generated files and applies the theme
#
# To change a setting, edit this file and run:
#   ~/.config/appearance/apply.sh
# (or just toggle the theme with Alt+T / Alt+Shift+T).

# Theme used on first login (dark or light).
DEFAULT_THEME=dark

# --- Cursor -------------------------------------------------------------
# Theme installed in /usr/share/icons (see root/ in this repo) and size.
CURSOR_THEME="KryptonBlackRH"
CURSOR_SIZE=24

# --- Fonts --------------------------------------------------------------
TERM_FONT="JetBrainsMono Nerd Font"
TERM_FONT_SIZE=11
ICON_FONT="Symbols Nerd Font"
ICON_FONT_SIZE=11

# --- Wallpapers ---------------------------------------------------------
# Filenames inside ~/Pictures/wallpapers.
WALLPAPER_DARK="solarized_dark_01.png"
WALLPAPER_LIGHT="solarized_light_01.png"

# --- bspwm look ---------------------------------------------------------
BORDER_WIDTH=2
WINDOW_GAP=12