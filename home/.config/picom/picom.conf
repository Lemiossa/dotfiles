# picom configuration

backend = "glx";

shadow = true;

blur = {
    method = "gaussian";
    size = 10;
    deviation = 5.0;
};


rules = (
    { match = "focused"; opacity = 1.0; },
    { match = "!focused"; opacity = 0.85; },
    { match = "class_g = 'Polybar'"; shadow = false; opacity = 1.0; },
    { match = "class_g = 'firefox'"; blur-background = false; shadow = false; }
)

animations = ({
            triggers = ["close", "hide"];
            preset = "disappear";
            scale = 0.6;
        }, {
            triggers = ["open", "show"];
            preset = "appear";
            scale = 0.6;
        })
