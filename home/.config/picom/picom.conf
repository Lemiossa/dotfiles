# Configuração do picom

backend = "glx";
vsync = true;
use-damage = true;

# Cantos arredondados
corner-radius = 10;

# Sombras suaves
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Blur atras de janelas translucidas
blur-method = "dual_kawase";
blur-strength = 5;

rules = (
    # Polybar ja desenha o proprio raio; Dunst tambem
    { match = "class_g = 'Polybar'"; shadow = false; corner-radius = 0; },
    { match = "class_g = 'Dunst'"; shadow = false; corner-radius = 0; },
    # Apenas o terminal escurece quando perde o foco
    { match = "class_g = 'Alacritty' && !focused"; opacity = 0.9; }
)

animations = ({
            triggers = ["close", "hide"];
            preset = "disappear";
            scale = 0.6;
        }, {
            triggers = ["open", "show"];
            preset = "appear";
            scale = 0.6;
        })
