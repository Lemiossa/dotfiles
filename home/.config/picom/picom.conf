# Configuração do picom

backend = "glx";
vsync = true;
use-damage = true;

blur-method = "dual_kawase";
blur-strength = 5;

rules = (
    # O dwm e o Dunst desenham seus proprios elementos; sem sombra.
    { match = "class_g = 'dwm'"; shadow = false; corner-radius = 0; },
    { match = "class_g = 'Dunst'"; shadow = false; corner-radius = 0; },
    # ST nao tem transparencia nativa (sem patch alpha); o picom cuida disso.
    { match = "class_g = 'st-256color'"; opacity = 0.94; },
    { match = "class_g = 'st-256color' && !focused"; opacity = 0.88; }
)

